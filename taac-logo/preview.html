<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>TAAC logo preview</title>
      <style>
         :root {
            font-family: system-ui, sans-serif;
         }
         body {
            margin: 0;
            padding: 2rem;
            background: #eef1f4;
            color: #111827;
         }
         h1 {
            font-size: 1.25rem;
            margin: 0 0 0.25rem;
         }
         p.lede {
            color: #6b7280;
            margin: 0 0 2rem;
         }
         .grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
         }
         .card {
            border-radius: 12px;
            padding: 3rem 1.5rem;
            display: flex;
            justify-content: center;
         }
         .light {
            background: #fff;
            border: 1px solid #e5e7eb;
         }
         .dark {
            background: #111827;
         }
         .card img {
            max-width: 100%;
            height: auto;
         }
         h2 {
            font-size: 0.9rem;
            font-weight: 600;
            margin: 2rem 0 0.5rem;
            color: #374151;
         }
         .fav {
            display: flex;
            align-items: flex-end;
            gap: 2rem;
         }
         .fav figure {
            margin: 0;
            text-align: center;
         }
         .fav figcaption {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 0.25rem;
         }
      </style>
   </head>
   <body>
      <h1>TAAC logo</h1>
      <p class="lede">
         Stack of emulated containers, one slot short — the top box is dashed because TAAC is
         technically almost a cluster.
      </p>

      <h2>Mark</h2>
      <div class="grid">
         <div class="card light">
            <img src="taac-mark.svg" width="220" alt="TAAC mark on light" />
         </div>
         <div class="card dark">
            <img src="taac-mark-white.svg" width="220" alt="TAAC mark on dark" />
         </div>
         <div class="card light">
            <img src="taac-mark-blue.svg" width="220" alt="TAAC mark, blue accent" />
         </div>
      </div>

      <h2>Lockup</h2>
      <div class="grid">
         <div class="card light">
            <img src="taac-logo.svg" width="430" alt="TAAC logo on light" />
         </div>
         <div class="card dark">
            <img src="taac-logo-dark.svg" width="430" alt="TAAC logo on dark" />
         </div>
         <div class="card light">
            <img src="taac-logo-blue.svg" width="430" alt="TAAC logo, blue accent" />
         </div>
      </div>

      <h2>Favicon sizes</h2>
      <div class="fav">
         <figure>
            <img src="taac-mark-32.png" alt="32px mark" />
            <figcaption>32</figcaption>
         </figure>
         <figure>
            <img src="taac-mark-64.png" alt="64px mark" />
            <figcaption>64</figcaption>
         </figure>
         <figure>
            <img src="taac-mark-128.png" alt="128px mark" />
            <figcaption>128</figcaption>
         </figure>
      </div>
   </body>
</html>
